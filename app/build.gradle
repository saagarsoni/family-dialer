plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.saagarsoni.dialer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saagarsoni.dialer'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile file('dialer.keystore')
            storePassword 'dialer123'
            keyAlias 'dialer'
            keyPassword 'dialer123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
